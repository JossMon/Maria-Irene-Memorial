<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" fill="none">
  <defs>
    <linearGradient id="stem" x1="54" y1="364" x2="365" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7D957F"/>
      <stop offset="1" stop-color="#A8B9A8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B8C9B8"/>
      <stop offset="1" stop-color="#D7E1D4"/>
    </linearGradient>
    <radialGradient id="petal" cx="0" cy="0" r="1" gradientTransform="translate(.32 .28) rotate(48) scale(.92)">
      <stop stop-color="#F5F0F8"/>
      <stop offset=".72" stop-color="#D8CCE5"/>
      <stop offset="1" stop-color="#C4B5D5"/>
    </radialGradient>
  </defs>

  <!-- airy branch -->
  <path d="M42 378C98 318 136 271 184 220C239 162 290 111 370 46" stroke="url(#stem)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M111 304C103 272 104 249 116 226" stroke="#9DB09D" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M179 231C162 207 155 183 160 158" stroke="#9DB09D" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M252 154C236 132 233 109 240 86" stroke="#9DB09D" stroke-width="2.2" stroke-linecap="round"/>

  <!-- eucalyptus leaves -->
  <g fill="url(#leaf)" stroke="#91A691" stroke-width="1.25">
    <ellipse cx="88" cy="329" rx="31" ry="12" transform="rotate(-42 88 329)"/>
    <ellipse cx="119" cy="290" rx="28" ry="11" transform="rotate(34 119 290)"/>
    <ellipse cx="145" cy="263" rx="29" ry="11" transform="rotate(-31 145 263)"/>
    <ellipse cx="187" cy="219" rx="31" ry="11.5" transform="rotate(34 187 219)"/>
    <ellipse cx="222" cy="183" rx="29" ry="11" transform="rotate(-30 222 183)"/>
    <ellipse cx="266" cy="141" rx="30" ry="11" transform="rotate(30 266 141)"/>
    <ellipse cx="307" cy="104" rx="28" ry="10.5" transform="rotate(-27 307 104)"/>
    <ellipse cx="338" cy="76" rx="24" ry="9.5" transform="rotate(30 338 76)"/>
    <ellipse cx="102" cy="266" rx="24" ry="9" transform="rotate(-72 102 266)"/>
    <ellipse cx="154" cy="189" rx="23" ry="8.5" transform="rotate(-70 154 189)"/>
    <ellipse cx="238" cy="112" rx="22" ry="8.5" transform="rotate(-68 238 112)"/>
  </g>

  <!-- small lavender-like blossoms, delicate not cartoonish -->
  <g fill="url(#petal)" stroke="#C9BAD8" stroke-width=".7">
    <g transform="translate(109 221)">
      <ellipse cx="0" cy="0" rx="9" ry="15" transform="rotate(-28)"/>
      <ellipse cx="13" cy="2" rx="8" ry="13" transform="rotate(38 13 2)"/>
      <ellipse cx="6" cy="13" rx="8" ry="13" transform="rotate(8 6 13)"/>
      <circle cx="6" cy="6" r="3.3" fill="#B9A5CC" stroke="none"/>
    </g>
    <g transform="translate(177 153) scale(.9)">
      <ellipse cx="0" cy="0" rx="9" ry="15" transform="rotate(-28)"/>
      <ellipse cx="13" cy="2" rx="8" ry="13" transform="rotate(38 13 2)"/>
      <ellipse cx="6" cy="13" rx="8" ry="13" transform="rotate(8 6 13)"/>
      <circle cx="6" cy="6" r="3.3" fill="#B9A5CC" stroke="none"/>
    </g>
    <g transform="translate(264 79) scale(.82)">
      <ellipse cx="0" cy="0" rx="9" ry="15" transform="rotate(-28)"/>
      <ellipse cx="13" cy="2" rx="8" ry="13" transform="rotate(38 13 2)"/>
      <ellipse cx="6" cy="13" rx="8" ry="13" transform="rotate(8 6 13)"/>
      <circle cx="6" cy="6" r="3.3" fill="#B9A5CC" stroke="none"/>
    </g>
  </g>

  <!-- tiny buds -->
  <g fill="#D7CCE4">
    <circle cx="100" cy="237" r="4.5"/><circle cx="116" cy="210" r="3.6"/><circle cx="164" cy="169" r="4"/>
    <circle cx="185" cy="140" r="3.4"/><circle cx="249" cy="96" r="3.8"/><circle cx="277" cy="68" r="3.2"/>
  </g>
</svg>
